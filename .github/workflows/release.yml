# Version-and-tag flow with no npm publishing (consumers install via git dependency).
# When changesets are pending, opens/updates a "Version Packages" PR that bumps
# package.json and CHANGELOG.md. When that PR is merged, tags the new version
# (e.g. v1.0.0) so consumers can pin to it, e.g.:
#   "nexus-design-system": "github:andrew-tran-0074/nexus-design-system-testing-#v1.0.0"
name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  version-and-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Create or update Version Packages PR
        uses: changesets/action@v1
        with:
          version: npx changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag release if version changed
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists, skipping."
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi
